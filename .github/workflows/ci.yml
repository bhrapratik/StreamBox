name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Tests actually ran (count > 0)
        run: |
          n=$(find . -path "*/test-results/*" -name "*.xml" -exec grep -ho 'tests="[0-9]*"' {} + | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "Tests run: $n"
          [ "${n:-0}" -gt 0 ]

      - name: Lint
        run: ./gradlew lintDebug

      - name: Agent config sanity
        run: |
          for f in .claude/skills/*/SKILL.md .claude/agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "Bad frontmatter: $f"; exit 1; }
          done